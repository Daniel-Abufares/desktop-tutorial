# הטבות צבירה / קאשבק לכל כרטיס או חשבון.
#
# הקובץ ריק כרגע. Claude Code ישאל אותך פעם אחת מה ההטבות של כל כרטיס,
# וימלא את הבלוק למטה. כל עוד הקובץ ריק — שלב אופטימיזציית ההטבות מדולג בשקט.
#
# אזהרה: ההשוואה כאן היא כיוון לבדיקה ידנית בלבד, לא המלצה פיננסית.
# סוגי הטבות שונים (נקודות מול מיילים מול קאשבק) לא תמיד ניתנים
# להשוואה מספרית ישירה.
#
# --- סכימה ---
#
# accounts:
#   <account-name>:
#     display_name: "כאל 1234"
#     default_rate: 0.5          # אחוז החזר בסיסי על כל הוצאה (0 אם אין)
#     unit: "אחוז"               # "אחוז" / "נקודות" / "מיילים" — לתצוגה בלבד
#     benefits:
#       - category: "מסעדות ובתי קפה"
#         rate: 3.0              # אחוז/מכפיל בקטגוריה הזו
#         note: "x3 נקודות"
#       - category: "סופרמרקט"
#         rate: 2.0
#
# --- דוגמה (מוערת, לא פעילה) ---
#
# accounts:
#   cal-1234:
#     display_name: "כאל זהב"
#     default_rate: 0.5
#     unit: "אחוז"
#     benefits:
#       - category: "מסעדות ובתי קפה"
#         rate: 3.0
#         note: "x3 נקודות על מסעדות"
#   cal-5678:
#     display_name: "כאל דיינרס"
#     default_rate: 1.0
#     unit: "אחוז"
#     benefits:
#       - category: "סופרמרקט"
#         rate: 2.5

accounts: {}
